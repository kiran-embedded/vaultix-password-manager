<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B4E" /> <!-- Deep dark purple -->
      <stop offset="50%" stop-color="#4B0082" /> <!-- Indigo/Purple -->
      <stop offset="100%" stop-color="#B57EDC" /> <!-- Lavender -->
    </linearGradient>

    <!-- Shackle Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0E0E0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BDBDBD" />
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="800" height="200" rx="16" ry="16" fill="url(#bgGrad)" />

  <!-- Floating Background Particles -->
  <g fill="#E6E6FA" opacity="0.2">
    <circle cx="100" cy="50" r="4">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20; 0,0" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="150" r="6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-30; 0,0" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="170" r="3">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="40" r="5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-25; 0,0" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Lock Icon -->
  <g>
    <!-- Master floating animation for the entire lock -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="4s" repeatCount="indefinite" />
    
    <g transform="translate(120, 50)">
      <!-- Lock Shackle -->
      <path d="M 30 40 L 30 25 C 30 5, 70 5, 70 25 L 70 40" 
            fill="none" 
            stroke="url(#shackleGrad)" 
            stroke-width="12" 
            stroke-linecap="round" />
            
      <!-- Lock Body -->
      <rect x="15" y="35" width="70" height="55" rx="10" ry="10" 
            fill="#E6E6FA" 
            stroke="#FFFFFF" stroke-width="2"/>
      
      <!-- Keyhole -->
      <circle cx="50" cy="55" r="7" fill="#4B0082" />
      <path d="M 46 60 L 54 60 L 56 75 L 44 75 Z" fill="#4B0082" />
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(250, 115)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="4">
      VAULTIX
    </text>
    <text x="5" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#E6E6FA" letter-spacing="2">
      PASSWORD MANAGER
    </text>
  </g>
</svg>
